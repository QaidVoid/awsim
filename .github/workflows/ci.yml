name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (check, test, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold clang

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      # Starts the real binary and sends every registered service a
      # request. The in-tree tests drive an in-process router and never
      # touch connection setup, which is how a build that panicked on
      # its very first request once passed all of them.
      - name: Smoke (every service answers)
        run: |
          cargo build --release --bin awsim
          python3 xtask/smoke.py ./target/release/awsim

      # A response field emitted under the SDK's model name instead of
      # its wire name parses as absent, which no in-tree test can see:
      # the handler and the assertion agree with each other and both
      # disagree with every real client.
      - name: Wire names match the SDK models
        run: |
          pip install --quiet botocore
          python3 xtask/wire_shape_check.py \
            --models "$(python3 -c 'import botocore, os; print(os.path.join(os.path.dirname(botocore.__file__), "data"))')"

  ui:
    name: SvelteKit UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: cd ui && bun install --frozen-lockfile

      - name: Build
        run: cd ui && bun run build

      - name: Type check
        run: cd ui && bun run check
